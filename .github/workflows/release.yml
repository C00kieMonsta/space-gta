name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Package game release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify release version
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw Error("Tag and package version differ");'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-browser-test-results
          path: test-results/
          retention-days: 7
      - run: pnpm pack --out release.tgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          artifact="space-gta-game-${version}.tgz"
          mv release.tgz "$artifact"
          sha256sum "$artifact" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "$artifact" SHA256SUMS --verify-tag --generate-notes --title "Space GTA $GITHUB_REF_NAME"
